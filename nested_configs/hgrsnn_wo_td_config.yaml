bounds:
  alpha_0:
  - 0.1
  - 1.0
  threshold_0:
  - 0.1
  - 3.
  alpha_1:
  - 0.1
  - 1.0
  threshold_1:
  - 0.1
  - 3.
  alpha_2:
  - 0.1
  - 1.0
  threshold_2:
  - 0.1
  - 3.
  lr:
  - 0.00001
  - 1.0

stages:
- source: nested_train
  get_args_static: get_random_seeds
  compute_features: train_model
  filter_features: combine_losses
  get_objectives: get_objectives

optimization_title: three_layer_bsnn_lif
objective_names:
    - avg_val_loss
    - avg_val_auc

x0:
  alpha_0: 0.9
  threshold_0: 1.0
  alpha_1: 0.9
  threshold_1: 1.0
  alpha_2: 0.9
  threshold_2: 1.0
  lr: 0.001

