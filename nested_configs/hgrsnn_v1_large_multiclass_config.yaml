bounds:
  alpha_0:
  - 0.1
  - 1.0
  threshold_0:
  - 0.1
  - 3.0
  alpha_1:
  - 0.1
  - 1.0
  threshold_1:
  - 0.1
  - 3.0
  alpha_2:
  - 0.1
  - 1.0
  threshold_2:
  - 0.1
  - 3.0
  lr:
  - 1.0e-05
  - 1.0
stages:
- source: nested_train
  get_args_static: get_random_seeds
  compute_features: train_model
  filter_features: combine_losses
  get_objectives: get_objectives
optimization_title: four_layer_hgrsnn_v1_lif_multiclass
objective_names:
- avg_val_loss
- avg_val_auc
x0:
  alpha_0: 0.9
  threshold_0: 1.0
  alpha_1: 0.9
  threshold_1: 1.0
  alpha_2: 0.9
  threshold_2: 1.0
  lr: 0.001
xbest:
  alpha_0: 0.5011619287590786
  threshold_0: 0.1220381625561909
  alpha_1: 0.5151470574577421
  threshold_1: 0.13281077688770326
  alpha_2: 0.12171747163526622
  threshold_2: 1.289744482284484
  lr: 0.07719697825016393

# avg_val_auc: 0.15656699618180578
# avg_val_loss: 0.8937957070813034

kwargs:
  num_seeds: 5
  model_type: four_layer_hgsnn
  recurrent_dims:
  - 32
  - 64
  - 32
  neuron_type: lif
  out_type: linear
  bias: false
  dataset_configs:
    data_file: /expanse/lustre/scratch/rpemmaraju/temp_project/processed_beats/data.hdf5
    metadata: /expanse/lustre/scratch/rpemmaraju/temp_project/processed_beats/data.csv
    train_prop: 0.6
    val_prop: 0.2
    test_prop: 0.2
    balance: true
    fourier: false
  train_batch_size: 64
  eval_batch_size: 128
  num_epochs: 20
  binary: false
  out_dims: 4
  optimizer: sgd
  # z-score each beat by its own record's mean/std instead of by one global
  # constant over the training set. false is the original behaviour; true needs
  # a dataset carrying patient_mean/patient_std (see create_beat_dataset.py).
  patient_norm: true
