bounds:
  alpha_0:
  - 0.1
  - 1.0
  threshold_0:
  - 0.1
  - 3.
  alpha_1:
  - 0.1
  - 1.0
  threshold_1:
  - 0.1
  - 3.
  alpha_out:
  - 0.1
  - 1.0
  threshold_out:
  - 0.1
  - 3.
  lr:
  - 0.00001
  - 1.0

stages:
- source: nested_train
  get_args_static: get_random_seeds
  compute_features: train_model
  filter_features: combine_losses
  get_objectives: get_objectives

optimization_title: two_layer_snn_lif
objective_names:
    - avg_val_loss
    - avg_val_auc

x0:
  alpha_0: 0.9
  threshold_0: 1.0
  alpha_1: 0.9
  threshold_1: 1.0
  alpha_out: 0.9
  threshold_out: 1.0
  lr: 0.001

xbest:
  alpha_0: 0.9
  threshold_0: 2.678568637524798
  alpha_1: 0.9
  threshold_1: 1.9004891742139431
  alpha_out: 0.9
  threshold_out: 0.44508736622031775
  lr: 0.536430315709671

kwargs:
  num_seeds: 5
  model_type: two_layer_snn
  recurrent_dims:
  - 32
  - 64
  neuron_type: lif
  out_type: lif
  bias: False
  dataset_configs:
    data_file: "/expanse/lustre/scratch/rpemmaraju/temp_project/processed_beats/data.hdf5"
    metadata: "/expanse/lustre/scratch/rpemmaraju/temp_project/processed_beats/data.csv"
    train_prop: 0.6
    val_prop: 0.2
    test_prop: 0.2
    balance: true
    fourier: false
  train_batch_size: 64
  eval_batch_size: 128
  num_epochs: 20
  optimizer: sgd
  # z-score each beat by its own record's mean/std instead of by one global
  # constant over the training set. false is the original behaviour; true needs
  # a dataset carrying patient_mean/patient_std (see create_beat_dataset.py).
  patient_norm: true
