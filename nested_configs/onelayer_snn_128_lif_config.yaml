bounds:
  alpha_0:
  - 0.001
  - 1.
  threshold_0:
  - 0.5
  - 2.
  alpha_out:
  - 0.001
  - 1.
  threshold_out:
  - 0.5
  - 2.
  lr:
  - 0.00001
  - 0.1

stages:
- source: nested_train
  get_args_static: get_random_seeds
  compute_features: train_model
  filter_features: combine_losses
  get_objectives: get_objectives

optimization_title: onelayer_snn_lif
objective_names:
    - avg_val_loss
    - avg_val_auc

x0:
  alpha_0: 0.5
  threshold_0: 1.0
  alpha_out: 0.5
  threshold_out: 1.0
  lr: 0.001

kwargs:
  num_seeds: 2
  model_type: one_layer_snn
  recurrent_dims:
  - 128
  neuron_type: lif
  out_type: lif
  bias: True
  dataset_configs:
    data_file: "/Users/rahul/Documents/Milstein_lab/arrhythmia_detection/beat_neurokit_1.hdf5"
    metadata: "/Users/rahul/Documents/Milstein_lab/arrhythmia_detection/beat_neurokit_1.csv"
    train_prop: 0.6
    val_prop: 0.2
    test_prop: 0.2
    balance: true
    fourier: false
  train_batch_size: 64
  eval_batch_size: 128
  num_epochs: 2
  val_steps: 1
  optimizer: sgd


