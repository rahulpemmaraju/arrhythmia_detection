# conventional 1d CNN classifier: conv -> relu -> pool, repeated, then a global
# pool and one dense prediction per window. the standard shape for ECG beat
# classification, and the counterpart to conv1d_config.yaml -- same widths, same
# optimizer, same budget, but it downsamples and predicts once instead of
# emitting a logit at every timestep.
#
# note this model is NOT causal and NOT online: it has the whole window in hand
# before predicting, which is more information than the SNNs ever get. that is
# the normal way to build this baseline, but it is a difference to state rather
# than one to gloss over.
model_type: convnet

model_kwargs:
  # same widths as the four_layer SNN configs' recurrent_dims
  hidden_dims:
  - 32
  - 64
  - 32
  kernel_size: 5     # must be odd for symmetric 'same' padding
  # each pool halves the time axis, so a fixed kernel spans twice the input per
  # block: receptive field 1 + 4*(1 + 2 + 4) = 29 samples (0.16s at 180Hz), and
  # the 360-sample (2s) window is 45 wide by the dense layer. no dilation needed
  # -- the stride does the widening that dilation does in conv1d_config.yaml.
  pool_size: 2
  pool_type: max
  global_pool: avg
  dropout: 0.0
  norm: none
  bias: false        # the SNN configs all run bias: false

binary: true
out_dims: 1

num_epochs: 20
val_steps: 5
train_batch_size: 64
eval_batch_size: 128

optimizer: sgd
lr: 0.01
momentum: 0.0
# weight_decay and grad_clip left unset -> 0.0 / off

dataset_configs:
  train_prop: 0.6
  val_prop: 0.2
  test_prop: 0.2
  balance: true
  fourier: false

# z-score each beat by its own record's mean/std instead of by one global
# constant over the training set. false matches the existing SNN pipeline, so
# results stay comparable; flip to true to test whether patient-specific gain is
# part of the inter-patient gap. needs a dataset carrying patient_mean/patient_std.
patient_norm: true
