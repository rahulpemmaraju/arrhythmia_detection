# ConvNet_Baseline with every conv1d swapped for a ConvTD layer. this is the
# direct counterpart to convnet_config.yaml -- identical widths, kernel, pooling,
# readout, optimizer and budget -- so the only thing that differs between the two
# runs is the layer type.
#
# that comparison is unusually clean here, because ConvTD is a strict superset of
# conv1d rather than a different architecture: at fixed_R = fixed_U = fixed_W =
# true and dynamic_K = false it computes bit-for-bit what the conv1d it replaced
# would (verified to ~1e-8 on the full model, and to ~1e-7 per layer across every
# kernel_size/padding pair in conv_td.py's __main__). so any gap against
# convnet_config.yaml is attributable to dynamic_K below, not to an incidental
# change in capacity or receptive field.
#
# the same caveats as convnet_config.yaml apply: NOT causal and NOT online, one
# prediction per window, so it sees more than the SNNs do.
#
# COST: ConvTD steps through time in a python loop instead of one batched conv
# call -- 636 sequential iterations per forward at T=360 with two pools. measured
# ~18x slower per train step than convnet at train_batch_size 64 (857ms vs 46ms,
# fwd+bwd, cpu). budget accordingly, and prefer larger batches, which amortize
# the per-step overhead rather than adding to it.
model_type: convtd

model_kwargs:
  # same widths as the four_layer SNN configs' recurrent_dims, and as convnet
  hidden_dims:
  - 32
  - 64
  - 32
  kernel_size: 5     # must be odd for symmetric 'same' padding
  pool_size: 2
  pool_type: max
  global_pool: avg
  dropout: 0.0
  norm: none
  bias: false        # ConvTD has no bias term; true is rejected, not ignored

  #   fixed_R: false -> each layer may carry state across time, which a conv cannot
  #   fixed_U: false -> the top-down path stops being a plain sum over taps
  #   fixed_W: false -> the state-to-readout map becomes learnable
  fixed_R: true
  fixed_U: true
  fixed_W: true

  # the actual proposal: the kernel is reweighted per timestep, per output
  # channel, by exp(LayerNorm(s[t-1]) @ Ks.T). Ks starts at zero, so training
  # begins at exactly the conv and deforms away from it -- there is no
  # initialization jump to a different function.
  # set false to reproduce convnet_config.yaml through this code path, which is
  # the sanity check that the swap changed nothing it should not have.
  dynamic_K: false

binary: true
out_dims: 1

num_epochs: 20
val_steps: 2
train_batch_size: 64
eval_batch_size: 128

optimizer: sgd
lr: 0.01
momentum: 0.0

dataset_configs:
  train_prop: 0.6
  val_prop: 0.2
  test_prop: 0.2
  balance: true
  fourier: false

patient_norm: true
