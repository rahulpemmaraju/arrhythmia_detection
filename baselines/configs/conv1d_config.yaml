# 1d conv net baseline, binary normal vs abnormal.
#
# stripped to compare architectures and nothing else: no dropout, no norm, no
# residual connections, no bias, plain SGD with no momentum or weight decay, and
# the final epoch's weights are what gets evaluated. all of that matches how
# main.py trains the SNNs, so a difference in the result is a difference in the
# architecture rather than in the training recipe.
model_type: conv1d

model_kwargs:
  # same widths as the four_layer SNN configs' recurrent_dims
  hidden_dims:
  - 32
  - 64
  - 32
  kernel_size: 7
  # a conv net's memory is exactly its receptive field, so unlike the recurrent
  # models it cannot integrate over anything wider. undilated, three blocks see
  # only 19 samples -- 0.11s at this dataset's 180Hz, barely a QRS complex.
  # dilation costs no parameters, so it is the only way to fix that at this
  # layer count and size. base 4 gives dilations 1, 4, 16 -> 1 + 6*(1+4+16) =
  # 127 samples (~0.7s), about a full beat within the 2s window. base stays
  # <= kernel_size so coverage has no holes.
  dilate: true
  dilation_base: 4
  causal: false       # acausal: each output also sees later samples in the window
  dropout: 0.0
  norm: none
  residual: false
  readout: per_timestep
  bias: false        # the SNN configs all run bias: false

binary: true
out_dims: 1

num_epochs: 20
val_steps: 2
train_batch_size: 64
eval_batch_size: 128

optimizer: sgd
lr: 0.01
momentum: 0.0
# weight_decay and grad_clip left unset -> 0.0 / off

dataset_configs:
  train_prop: 0.6
  val_prop: 0.2
  test_prop: 0.2
  balance: true
  fourier: false

patient_norm: true
